[project]
name = "wyoming-piper"
version = "2.4.2"
description = "Wyoming Server for Piper"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Michael Hansen", email = "mike@rhasspy.org"}
]
keywords = ["rhasspy", "wyoming", "piper", "tts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "wyoming>=1.8,<2",
    "regex>=2024.11.6",
    "piper-tts>=1.6.1,<2",
    "sentence-stream>=1.2.0,<2",
]

[project.urls]
Homepage = "http://github.com/rhasspy/wyoming-piper"

[project.scripts]
wyoming-piper = "wyoming_piper.__main__:run"

[tool.setuptools.packages.find]
include = ["wyoming_piper"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
wyoming_piper = ["voices.json"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy",
    "pylint",
    "pytest",
    "pytest-asyncio",
    "build",
    "flask>=3,<4",
    "scipy>=1.10,<2",
    "numpy>=1.20,<2",
    "python-speech-features>=0.6,<1",
]
http = [
    "wyoming[http]"
]
zeroconf = [
    "wyoming[zeroconf]",
]
zh = [
    "piper-tts[zh]",
]
# Everything the ONNX inference path actually imports, minus the omnivoice
# package itself. Pair with a separate "pip install --no-deps omnivoice":
# omnivoice requires gradio, librosa, webdataset and tensorboardx for its demo
# and training paths, none of which this backend imports, and skipping them drops
# 42 packages and ~600 MB. --no-deps cannot be expressed in an extra, so the two
# steps stay separate (see the Dockerfile and script/setup).
# audioop-lts is needed because pydub imports the stdlib audioop, removed in
# Python 3.13; it otherwise arrives only as a gradio dependency.
omnivoice-deps = [
    "torch",
    "torchaudio",
    "transformers",
    "accelerate",
    "pydub",
    "soundfile",
    "audioop-lts; python_version >= '3.13'",
    "onnxruntime",
    "huggingface_hub",
    "numpy",
]
# Self-contained, and ~600 MB heavier, since resolving the omnivoice package
# pulls its full dependency set. Prefer omnivoice-deps plus --no-deps omnivoice.
omnivoice = [
    "wyoming-piper[omnivoice-deps]",
    "omnivoice",
]
web = [
    "flask>=3,<4",
]
